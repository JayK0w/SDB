name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # modules verrouillés par go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      # gate de securite : echoue sur toute vulnerabilite atteignable qui
      # n'est pas declaree et justifiee dans .govulncheck-allow
      - name: Vulnerability scan
        run: bash scripts/vulncheck.sh
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/sdb

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sdb:ci .
