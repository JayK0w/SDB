# Hardened production deployment for SDB (spec §4).
#
# Before the first start, generate the secrets:
#   mkdir -p secrets
#   openssl rand -hex 32 > secrets/sdb_master_key
#   openssl rand -hex 32 > secrets/sdb_jwt_secret
#
# Then:  docker compose up -d --build
# First-login admin password: docker compose logs sdb | grep "initial admin"

services:
  sdb:
    build: .
    image: sdb:latest
    container_name: sdb
    restart: unless-stopped

    # Loopback-only on the host: Docker port publishing bypasses
    # iptables/UFW, so never bind 0.0.0.0 here. Put a reverse proxy with
    # TLS in front for remote access.
    ports:
      - "127.0.0.1:8080:8080"

    # Immutable root filesystem, no privilege escalation, every Linux
    # capability dropped: SDB needs none — it only talks to the Docker
    # socket and writes its SQLite database under /data.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

    volumes:
      # Root-equivalent by design: SDB orchestrates containers. Keep this
      # compose file on a trusted host only.
      - /var/run/docker.sock:/var/run/docker.sock
      # The only writable state: SQLite database and runtime data.
      - sdb-data:/data

    environment:
      # 0.0.0.0 inside the container is required for the port mapping to
      # work; the loopback guarantee is the host-side binding above.
      SDB_LISTEN_HOST: "0.0.0.0"
      SDB_DATA_DIR: /data
      SDB_MASTER_KEY_FILE: /run/secrets/sdb_master_key
      SDB_JWT_SECRET_FILE: /run/secrets/sdb_jwt_secret
      SDB_LOG_LEVEL: info
      SDB_LOG_FORMAT: json
      # Weekly repository integrity checks; set to 0 to disable.
      SDB_CHECK_INTERVAL: 168h

    secrets:
      - sdb_master_key
      - sdb_jwt_secret

secrets:
  sdb_master_key:
    file: ./secrets/sdb_master_key
  sdb_jwt_secret:
    file: ./secrets/sdb_jwt_secret

volumes:
  sdb-data:
