
services:
  sdb:
    build: .
    image: sdb:latest
    container_name: sdb
    restart: unless-stopped

    # loopback-only côté hôte : la publication de port Docker contourne
    # iptables/UFW — ne jamais binder 0.0.0.0 ici. Reverse proxy TLS
    # devant pour un accès distant.
    ports:
      - "127.0.0.1:8080:8080"

    # rootfs immuable, pas d'escalade de privilèges, zéro capability :
    # SDB n'a besoin de rien d'autre que le socket et /data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

    volumes:
      # accès root-équivalent assumé : SDB orchestre des conteneurs
      - /var/run/docker.sock:/var/run/docker.sock
      # seul état inscriptible : la base SQLite
      - sdb-data:/data

    environment:
      # 0.0.0.0 nécessaire DANS le conteneur pour le mapping de port ;
      # la garantie loopback est le binding hôte ci-dessus
      SDB_LISTEN_HOST: "0.0.0.0"
      SDB_DATA_DIR: /data
      SDB_MASTER_KEY_FILE: /run/secrets/sdb_master_key
      SDB_JWT_SECRET_FILE: /run/secrets/sdb_jwt_secret
      SDB_LOG_LEVEL: info
      SDB_LOG_FORMAT: json
      # vérifications d'intégrité hebdomadaires ; 0 pour désactiver
      SDB_CHECK_INTERVAL: 168h
      # restauration de VÉRIFICATION : le dernier snapshot de chaque dépôt est
      # réellement extrait dans un volume jetable (sdb-verify-*) avec contrôle
      # des empreintes, puis le volume est détruit. Seule preuve qu'une
      # sauvegarde est restaurable — le reste prouve qu'elle existe.
      # Coûteux en I/O : décaler si la fenêtre chevauche la production.
      SDB_VERIFY_INTERVAL: ${SDB_VERIFY_INTERVAL:-168h}
      # alerte sortante sur run terminé en échec ou avertissement. Vide =
      # aucune alerte, les échecs ne sont visibles que dans /metrics et les
      # logs. Peut contenir un jeton : la renseigner dans le .env, jamais ici.
      SDB_ALERT_WEBHOOK: ${SDB_ALERT_WEBHOOK:-}
      SDB_ALERT_TIMEOUT: ${SDB_ALERT_TIMEOUT:-10s}
      # /metrics Prometheus (désactivé si vide) ; exporter la variable ou
      # la mettre dans un fichier .env à côté de ce compose
      SDB_METRICS_TOKEN: ${SDB_METRICS_TOKEN:-}

    secrets:
      - sdb_master_key
      - sdb_jwt_secret

secrets:
  sdb_master_key:
    file: ./secrets/sdb_master_key
  sdb_jwt_secret:
    file: ./secrets/sdb_jwt_secret

volumes:
  sdb-data:
